<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | TrueGeoIP</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon.png?v=20260208-iconfix1">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260208-iconfix1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Nunito:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=20260208-mobilefix1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="/"
                    style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.5rem;">
                    <img src="/static/img/logo.png" alt="TrueGeoIP Logo" style="height: 32px; width: auto;">
                    TrueGeoIP
                </a>
            </div>
            <div class="nav-links">
                <a href="/">Home</a>
            </div>
        </div>
    </nav>

    <div class="container"
        style="display: flex; justify-content: center; align-items: center; min-height: 80vh; padding-top: 80px;">
        <div class="glass-card"
            style="padding: 2.5rem; width: 100%; max-width: 400px; background: var(--palette-3); border: 1px solid var(--card-border); box-shadow: none; border-radius: 16px;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <img src="/static/img/logo.png" alt="Logo" style="width: 48px; margin-bottom: 1rem;">
                <h1>Welcome Back</h1>
                <p style="color: var(--text-secondary);">Sign in to your account</p>
            </div>

            {% if error %}
            <div
                style="background: rgba(255, 122, 0, 0.12); border: 1px solid rgba(255, 122, 0, 0.28); color: var(--accent-primary); padding: 0.75rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9em; text-align: center;">
                {{ error }}
            </div>
            {% endif %}

            <form action="/signin" method="POST">
                <input type="hidden" name="next" value="{{ next or '/' }}">
                <div style="margin-bottom: 1.25rem;">
                    <label
                        style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.9em;">Email
                        Address</label>
                    <input type="email" name="email" required placeholder="name@company.com"
                        style="width: 100%; padding: 0.75rem; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; color: var(--text-primary); font-family: inherit; font-size: 1rem;">
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label
                        style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.9em;">Password</label>
                    <input type="password" name="password" required placeholder="••••••••"
                        style="width: 100%; padding: 0.75rem; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; color: var(--text-primary); font-family: inherit; font-size: 1rem;">
                </div>

                <button type="submit" class="btn-primary"
                    style="width: 100%; justify-content: center; padding: 0.875rem;">
                    Sign In
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; color: var(--text-secondary); font-size: 0.9em;">
                Don't have an account? <a href="/signup?next={{ next_encoded or '%2F' }}"
                    style="color: var(--accent-primary); text-decoration: none; font-weight: 500;">Sign Up</a>
            </div>

            <div style="position: relative; margin: 2rem 0; text-align: center;">
                <hr style="border: 0; border-top: 1px solid var(--card-border);">
                <span
                    style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--palette-3); padding: 0 0.75rem; color: var(--text-secondary); font-size: 0.85em;">OR</span>
            </div>

            <a href="/auth/google"
                style="display: flex; align-items: center; justify-content: center; gap: 0.75rem; width: 100%; padding: 0.875rem; background: var(--palette-3); color: var(--text-primary); border: 1px solid var(--card-border); border-radius: 8px; text-decoration: none; font-weight: 500; transition: none;">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"
                    style="width: 20px; height: 20px;">
                Sign in with Google
            </a>
        </div>
    </div>
    <div style="text-align: center; margin-top: 2rem; color: var(--text-tertiary); font-size: 0.8rem; opacity: 0.7;">
        &copy; 2026 TrueGeoIP.
    </div>
</body>

</html>
